# Nginx 配置 - PMIS
# 放置位置: /etc/nginx/conf.d/pmis.conf
# 使用方法: sudo nginx -t && sudo nginx -s reload

server {
    listen 80;
    server_name your-domain.com;  # 改为实际域名或 IP
    # PMIS 业务单文件上限为 20MB；预留 multipart 请求开销，网关放宽至 25MB。
    client_max_body_size 25m;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' https://ai.znjs.com:3100; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # 前端静态文件（需先执行 cd frontend && npm run build）
    root /path/to/PMIS/frontend/dist;
    index index.html;

    # 前端入口必须每次向服务器确认，避免发布后继续引用旧哈希分包。
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' https://ai.znjs.com:3100; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # React BrowserRouter：刷新业务路由时回退到前端入口。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 哈希资源内容变更即改名，可以长期缓存。
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' https://ai.znjs.com:3100; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:3103/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置（AI 问数等长请求）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 用户头像等上传资源
    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:3103/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # 静态资源缓存
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; frame-src 'self' https://ai.znjs.com:3100; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
