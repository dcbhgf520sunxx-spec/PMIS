*{box-sizing:border-box}body{margin:0;background:#f2f5f2;color:#193c34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.6}header{padding:24px 32px;background:#153e34;color:white;display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:27px;margin:0}header p{font-size:13px;color:#c8e0d2;margin:5px 0 0}header a{color:#d8efe1;font-size:13px}main{padding:22px;max-width:1600px;margin:auto}.counts{font-size:13px;color:#648174;margin-bottom:14px}.shell{display:grid;grid-template-columns:185px minmax(0,1fr) 370px;gap:16px;align-items:start}.panel{background:#fff;border:1px solid #d7e4dc;border-radius:13px;overflow:hidden}.panel-head{padding:14px 17px;border-bottom:1px solid #e0e8e3;font-size:13px;font-weight:700;color:#577466}.object-list{padding:8px}.object-list button{display:block;width:100%;text-align:left;padding:9px 11px;background:none;border:0;border-radius:8px;color:#365b4c;cursor:pointer;font:inherit;font-size:13px;margin:2px 0}.object-list button.active{background:#e2f1e8;color:#12654c;font-weight:700}.graph-head{padding:17px 20px;border-bottom:1px solid #dfe8e1;display:flex;justify-content:space-between;gap:12px;align-items:center}.graph-head h2{font-size:22px;margin:0}.legend{font-size:11px;color:#769083}.legend i{display:inline-block;width:18px;border-top:2px solid #7eaa93;vertical-align:middle;margin-right:5px}.legend .derived{border-top:2px dashed #bf914d;margin-left:12px}.graph-scroll{overflow:auto;min-height:520px}svg{display:block;width:100%;min-width:680px}.node{cursor:pointer;outline:none}.node rect{fill:#f3f8f4;stroke:#a9c7b5;stroke-width:1}.node text{fill:#245b46;font-size:15px;font-weight:600}.node.focus rect{fill:#17644e;stroke:#17644e}.node.focus text{fill:white}.edge{fill:none;stroke:#85ae99;stroke-width:1.5}.edge.derived{stroke:#bd9559;stroke-dasharray:5 4}.edge-label{fill:#496c59;font-size:11px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.details{padding:17px 18px}.details h3{font-size:21px;margin:0 0 5px}.iri{font-size:11px;color:#84978c;overflow-wrap:anywhere}.details p{font-size:13px;color:#496c59;margin:12px 0}.details h4{font-size:13px;margin:21px 0 10px;border-top:1px solid #e4ece7;padding-top:15px}.relation-row{font-size:12px;padding:9px 0;border-bottom:1px solid #edf1ee}.relation-row small{display:block;color:#85988d;font-size:10px}.badge{font-size:10px;background:#fff0d5;color:#956c32;border-radius:4px;padding:2px 5px}.attrs{display:flex;flex-wrap:wrap;gap:6px}.attrs span{background:#f0f5f1;border:1px solid #e0e8e2;padding:4px 7px;border-radius:5px;font-size:11px;color:#4e705e}.rules{padding-left:17px;color:#55745f;font-size:12px}.rules li{margin:6px 0}footer{padding:20px 4px;color:#7f9188;font-size:11px}details summary{cursor:pointer}details code{font-size:10px;overflow-wrap:anywhere}button:focus-visible,.node:focus-visible rect{outline:3px solid #b3d7c4;outline-offset:2px}@media(max-width:1100px){.shell{grid-template-columns:155px minmax(0,1fr)}#detail-panel{grid-column:1/-1}.details{columns:auto}.details>*{break-inside:avoid}}@media(max-width:700px){header{display:block;padding:20px}header a{display:inline-block;margin-top:10px}main{padding:12px}.shell{display:block}.panel{margin-bottom:12px}.object-list{display:flex;overflow:auto;gap:5px}.object-list button{width:auto;white-space:nowrap}.object-list-panel .panel-head{display:none}.details{columns:auto}.graph-head{display:block}.legend{margin-top:6px}h1{font-size:24px}.graph-scroll{min-height:0}.graph-head h2{font-size:21px}}@media print{.object-list-panel{display:none}.shell{display:block}.graph-scroll{overflow:visible}svg{min-width:0}.details{columns:2}}
.detail-tabs{display:flex;gap:4px;margin:16px 0;border-bottom:1px solid #e2ebe5;padding-bottom:8px}.detail-tabs button{border:0;background:transparent;color:#718579;padding:7px 8px;font:inherit;font-size:12px;cursor:pointer;border-radius:6px}.detail-tabs button.active{background:#e6f2ea;color:#17644e;font-weight:700}.definition{background:#f2f7f3;padding:12px;border-radius:8px}.detail-content h4:first-child{border:0;margin-top:0;padding-top:0}.detail-content ul{padding-left:18px;font-size:12px;color:#496c59}.detail-content li{margin:8px 0}.relation-row summary{font-weight:600;list-style-position:outside;margin-left:13px}.relation-row p{font-size:12px;margin:9px 0}.relation-row b{display:block;font-size:11px;color:#17644e}.hint{font-size:12px;color:#6c8174;margin:10px 20px 16px}.source-note{font-size:11px!important;color:#82968a!important}.field-list{font-size:12px;color:#496c59}.field-row{border-bottom:1px solid #edf1ee;padding:8px 0}.field-row strong{font-size:12px}.field-row span{display:block;font-size:11px;color:#789083}.attribute-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px}.attribute-row span{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-align:right}.edge-label{cursor:pointer}.edge-label:hover{fill:#12654c;text-decoration:underline}@media(min-width:1101px){#detail-panel{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}@media print{#detail-panel{max-height:none;position:static}.detail-tabs{display:none}}</style></head><body><header><div><h1>SIDM 本体关系图</h1><p>当前模型中的对象、关系、属性和数据检查规则 · 不是实时业务记录</p></div><a href="SIDM本体落地教材.html">返回本体教材 ↗</a></header><main><div class="counts" id="counts"></div><div class="shell"><aside class="panel object-list-panel"><div class="panel-head">14类业务对象 · 点击查看</div><div class="object-list" id="objects"></div></aside><section class="panel"><div class="graph-head"><h2 id="graph-title"></h2><div class="legend"><i></i>直接关系<i class="derived"></i>推导关系</div></div><div class="graph-scroll"><svg id="graph" role="img" aria-label="选中对象的关系图"></svg></div><p class="hint">点击对象切换关系图；点击连线文字查看这条关系的含义与边界。</p></section><aside class="panel" id="detail-panel"><div class="panel-head">业务说明 · 随所选对象切换</div><div class="details" id="details"></div></aside></div><footer><details><summary>业务依据：业务骨架 · 模型：OWL · 检查：SHACL</summary><p><a href="../../docs/SIDM业务骨架.md">查看业务骨架</a> · <a href="standard/sidm.ttl">查看OWL模型</a> · <a href="standard/shapes.ttl">查看SHACL规则</a></p><code id="fingerprint"></code></details></footer></main><script>
const model=__MODEL_DATA__;
const byId=Object.fromEntries(model.classes.map(c=>[c.id,c]));
const expanded=model.relations.flatMap(r=>r.from.flatMap(a=>r.to.map(b=>({...r,source:a,target:b}))));
let selected='Product',detailView='business',activeRelation='';const NS='http://www.w3.org/2000/svg';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function el(name,attrs,text){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs||{}))e.setAttribute(k,v);if(text!==undefined)e.textContent=text;return e}
function choose(id){selected=id;activeRelation='';detailView='business';render()}
function showRelation(id){detailView='relations';activeRelation=id;renderDetails();document.getElementById('detail-panel').scrollIntoView({block:'nearest',behavior:'smooth'})}
function renderDetails(){
 const c=byId[selected],b=c.business,links=expanded.filter(r=>r.source===selected||r.target===selected);
 const list=xs=>'<ul>'+xs.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ul>';
 const sections={
 business:`<div class="definition"><p>${esc(b.meaning)}</p><p>${esc(b.connections)}</p></div><h4>数量与归属</h4>${list(b.quantities)}<h4>人员角色</h4>${b.roles.length?list(b.roles.map(r=>r.role+'：'+r.meaning)):'<p>人员参与通过相关对象的角色表达；此对象未单独定义人员角色关系。</p>'}<h4>业务边界</h4><p>${esc(b.boundary)}</p><p class="source-note">以上来自已确认的《SIDM业务骨架》。名称和人员变更不会改变对象身份；同名记录也不自动视为同一个对象。</p>`,
 relations:`<p>箭头从关系的起点指向终点。下面共有${links.length}条类别连线；展开查看含义。</p>${links.map(r=>`<details class="relation-row" ${activeRelation===r.id?'open':''}><summary>${esc(byId[r.source].label)} → ${esc(r.label)} → ${esc(byId[r.target].label)} ${r.inferred?'<span class="badge">推导</span>':''}</summary><p><b>这条关系表示</b>${esc(r.meaning)}</p><p><b>数量与归属</b>${esc(r.quantity)}</p><p><b>业务边界</b>${esc(r.boundary)}</p>${r.proof.length?'<p><b>推导依据 · OWL</b>'+r.proof.map(esc).join('<br>')+'</p>':''}<small>模型关系：${esc(r.id)}</small></details>`).join('')}`,
 checks:`<h4>关键业务信息</h4><p>${esc(b.attributes)}</p>${b.states?'<h4>状态怎么表达</h4><p>'+esc(b.states)+'</p>':''}${b.earlyStates.length?'<h4>需求类型对应的前期状态</h4>'+list(b.earlyStates.map(r=>r[0]+'：'+r[1])):''}<details><summary>OWL中已有的属性 · ${c.attributes.length}项</summary><div class="field-list">${c.attributes.map(a=>'<div class="field-row attribute-row"><strong>'+esc(a.label)+'</strong><span>'+esc(a.id)+'</span></div>').join('')}</div></details><h4>SHACL实际检查</h4><p class="source-note">以下由当前检查文件读取。业务说明与已编码的检查范围分开展示，未列出的业务规则不等于已经自动检查。</p>${c.checks.length?'<div class="field-list">'+c.checks.map(r=>'<div class="field-row"><strong>'+esc(r.label)+'</strong><span>'+esc(r.text)+'</span></div>').join('')+'</div>':''}${c.rules.length?list(c.rules):''}${!c.rules.length&&!c.checks.length?'<p>此类别没有单独的SHACL检查项。</p>':''}`,
 completion:`<h4>${esc(c.label)}的完成判定</h4>${list(c.completionRules)}<h4>统一统计口径</h4>${model.completionPolicy.map(rule=>'<details><summary>'+esc(rule.label)+'</summary>'+rule.text.split('\n').map(text=>'<p>'+esc(text)+'</p>').join('')+'</details>').join('')}<p class="source-note">这里说明已确认的计算规则，不展示实际考核结果。数据不足时标记“待核实”。</p>`
 };
 document.getElementById('details').innerHTML=`<h3>${esc(c.label)}</h3><div class="iri">${esc(c.id)}</div><nav class="detail-tabs" aria-label="对象说明">${[['business','业务定义'],['relations','关系说明'],['checks','属性与检查'],['completion','完成率口径']].map(([id,label])=>`<button data-view="${id}" class="${id===detailView?'active':''}" aria-pressed="${id===detailView}">${label}</button>`).join('')}</nav><div class="detail-content">${sections[detailView]}</div>`;
 document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{detailView=button.dataset.view;renderDetails()});
}
function node(svg,id,x,y,focus=false){const c=byId[id];const group=el('g',{class:'node'+(focus?' focus':''),tabindex:'0',role:'button','aria-label':c.label,transform:`translate(${x-83},${y-24})`});group.append(el('rect',{width:166,height:48,rx:9}),el('text',{x:83,y:29,'text-anchor':'middle'},c.label));group.addEventListener('click',()=>choose(id));group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(id)}});svg.append(group)}
function render(){
 document.getElementById('counts').textContent=`本体 ${model.version} · ${model.classes.length}类对象 · ${model.relations.filter(r=>!r.inferred).length}种直接关系 · ${model.relations.filter(r=>r.inferred).length}种推导关系`;
 document.getElementById('objects').innerHTML='';const ordered=['Product','Requirement','Project','ProjectStage','KeyItem','Task','Bug','ProjectContract','PaymentStage','PaymentRecord','MaintenanceContract','WorkOrder','Supplier','Person'];for(const id of ordered){const b=document.createElement('button');b.textContent=byId[id].label;b.className=id===selected?'active':'';b.setAttribute('aria-pressed',String(id===selected));b.onclick=()=>choose(id);document.getElementById('objects').append(b)}
 const c=byId[selected],links=expanded.filter(r=>r.source===selected||r.target===selected);document.getElementById('graph-title').textContent=c.label+'的关系';
 const incoming=[...new Set(links.filter(r=>r.target===selected&&r.source!==selected).map(r=>r.source))],outgoing=[...new Set(links.filter(r=>r.source===selected&&r.target!==selected).map(r=>r.target))],loops=links.filter(r=>r.source===selected&&r.target===selected);
 const h=Math.max(490,Math.max(incoming.length,outgoing.length)*86+130),cy=h/2;const svg=document.getElementById('graph');svg.innerHTML='';svg.setAttribute('viewBox',`0 0 1000 ${h}`);svg.setAttribute('aria-label',c.label+'与'+new Set([...incoming,...outgoing]).size+'类对象的关系');const defs=el('defs');for(const[col,id]of [['#85ae99','arrow'],['#bd9559','derived-arrow']]){const m=el('marker',{id,viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});m.append(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:col}));defs.append(m)}svg.append(defs);
 function bundle(ids,left){ids.forEach((id,i)=>{const y=80+i*86+(h-(ids.length*86+100))/2;const rs=links.filter(r=>left?r.source===id&&r.target===selected:r.source===selected&&r.target===id);const derived=rs.every(r=>r.inferred);const x1=left?233:583,x2=left?417:767;svg.append(el('path',{d:`M ${x1} ${left?y:cy} C ${left?320:680} ${left?y:cy}, ${left?340:700} ${left?cy:y}, ${x2} ${left?cy:y}`,class:'edge'+(derived?' derived':''),'marker-end':`url(#${derived?'derived-arrow':'arrow'})`}));const text=el('text',{x:left?300:700,y:y-13,'text-anchor':'middle',class:'edge-label'});rs.forEach((r,j)=>{const line=el('tspan',{x:left?300:700,dy:j?15:0,tabindex:0,role:'button','aria-label':'查看'+r.label+'说明'},r.label+(r.inferred?'（推导）':''));line.onclick=()=>showRelation(r.id);line.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showRelation(r.id)}};text.append(line)});svg.append(text);node(svg,id,left?150:850,y)})}bundle(incoming,true);bundle(outgoing,false);
 if(loops.length){svg.append(el('path',{d:`M 470 ${cy-24} C 420 ${cy-112} 580 ${cy-112} 530 ${cy-24}`,class:'edge','marker-end':'url(#arrow)'}));const loopText=el('text',{x:500,y:cy-83,'text-anchor':'middle',class:'edge-label',tabindex:0,role:'button','aria-label':'查看'+loops[0].label+'说明'},loops.map(r=>r.label).join(' / '));loopText.onclick=()=>showRelation(loops[0].id);loopText.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();showRelation(loops[0].id)}};svg.append(loopText)}node(svg,selected,500,cy,true);
 renderDetails();
 document.getElementById('fingerprint').textContent='业务骨架 SHA256: '+model.businessSha256+' | OWL SHA256: '+model.sha256+' | SHACL SHA256: '+model.shapesSha256;
}render();
</script></body></html>
